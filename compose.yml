services:
  astro:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4321:80'
    env_file:
      - .env
  database:
    image: postgres:16
    container_name: database
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: